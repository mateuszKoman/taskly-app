name: Agent tests

# The test agent's own unit tests: path policy, triage, tools, loop, renderer, patch validation.
# They need no API key, so this workflow gets no secrets at all.
on:
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent-tests.yml"

permissions: {}

concurrency:
  group: agent-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Agent unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - run: python -m pip install --disable-pip-version-check -r agent/requirements.txt

      - run: python -m pytest agent/tests -q
